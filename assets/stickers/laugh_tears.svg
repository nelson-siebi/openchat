<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="faceGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffeb3b" />
      <stop offset="85%" stop-color="#f57f17" />
    </radialGradient>
    <linearGradient id="tearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7" />
      <stop offset="100%" stop-color="#0288d1" />
    </linearGradient>
  </defs>
  <style>
    .laugh-head {
      transform-origin: center;
      animation: giggle 0.4s ease-in-out infinite alternate;
    }
    .tear-l {
      transform-origin: 30px 60px;
      animation: streamL 0.6s ease-in infinite;
    }
    .tear-r {
      transform-origin: 90px 60px;
      animation: streamR 0.6s ease-in 0.1s infinite;
    }
    @keyframes giggle {
      0% { transform: rotate(-5deg) translateY(0); }
      100% { transform: rotate(5deg) translateY(-4px); }
    }
    @keyframes streamL {
      0% { opacity: 0; transform: scale(0.6) translate(0, 0); }
      50% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.3) translate(-14px, 20px); }
    }
    @keyframes streamR {
      0% { opacity: 0; transform: scale(0.6) translate(0, 0); }
      50% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.3) translate(14px, 20px); }
    }
  </style>
  <g class="laugh-head">
    <!-- Face -->
    <circle cx="60" cy="60" r="46" fill="url(#faceGrad)" />
    <!-- Squeezed Eyes > < -->
    <path d="M30 46 L46 54 L30 62" fill="none" stroke="#37474f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M90 46 L74 54 L90 62" fill="none" stroke="#37474f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Big Open Laughing Mouth -->
    <path d="M36 68 Q60 102 84 68 Z" fill="#b71c1c" />
    <!-- Tongue -->
    <path d="M48 86 Q60 98 72 86 Z" fill="#ff5252" />
    <!-- Upper Teeth -->
    <path d="M40 70 Q60 76 80 70" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  </g>
  <!-- Gushing Tears -->
  <path class="tear-l" d="M30 54 Q10 70 20 86 Q34 76 30 54 Z" fill="url(#tearGrad)" />
  <path class="tear-r" d="M90 54 Q110 70 100 86 Q86 76 90 54 Z" fill="url(#tearGrad)" />
</svg>
