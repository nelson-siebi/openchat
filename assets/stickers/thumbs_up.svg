<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="thumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="100%" stop-color="#ffb300" />
    </linearGradient>
    <filter id="thumbShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff8f00" flood-opacity="0.4" />
    </filter>
  </defs>
  <style>
    .thumb-bounce {
      transform-origin: 30px 80px;
      animation: thumbRock 0.8s ease-in-out infinite alternate;
    }
    @keyframes thumbRock {
      0% { transform: rotate(-8deg) scale(0.95); }
      100% { transform: rotate(10deg) scale(1.08); }
    }
  </style>
  <g class="thumb-bounce" filter="url(#thumbShadow)">
    <!-- Glove/Wrist -->
    <rect x="20" y="65" width="22" height="35" rx="6" fill="#00bcd4" />
    <rect x="18" y="62" width="26" height="8" rx="4" fill="#ffffff" />
    <!-- Hand Palm -->
    <rect x="42" y="55" width="45" height="42" rx="10" fill="url(#thumbGrad)" />
    <!-- Big Thumb Up -->
    <path d="M42 65 C42 65, 40 45, 48 30 C53 20, 62 18, 66 26 C68 32, 64 45, 62 55 Z" fill="url(#thumbGrad)" stroke="#ff8f00" stroke-width="2" />
    <!-- Fingers Folded -->
    <rect x="70" y="55" width="24" height="10" rx="5" fill="#ffe082" stroke="#ff8f00" stroke-width="1.5" />
    <rect x="72" y="65" width="24" height="10" rx="5" fill="#ffe082" stroke="#ff8f00" stroke-width="1.5" />
    <rect x="70" y="75" width="24" height="10" rx="5" fill="#ffe082" stroke="#ff8f00" stroke-width="1.5" />
    <rect x="66" y="85" width="24" height="10" rx="5" fill="#ffe082" stroke="#ff8f00" stroke-width="1.5" />
  </g>
</svg>
