<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="rockBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e0e0" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffff00" />
      <stop offset="60%" stop-color="#ff3d00" />
      <stop offset="100%" stop-color="#d50000" />
    </linearGradient>
  </defs>
  <style>
    .rocket {
      transform-origin: center;
      animation: flyRock 1.2s ease-in-out infinite alternate;
    }
    .rocket-fire {
      transform-origin: 30px 85px;
      animation: exhaust 0.3s ease-in-out infinite alternate;
    }
    @keyframes flyRock {
      0% { transform: translate(-3px, 3px) rotate(42deg); }
      100% { transform: translate(5px, -5px) rotate(48deg); }
    }
    @keyframes exhaust {
      0% { transform: scale(0.8, 0.7); }
      100% { transform: scale(1.15, 1.3); }
    }
  </style>
  <g class="rocket">
    <!-- Fire exhaust -->
    <path class="rocket-fire" d="M28 85 Q35 115 15 110 Q25 90 28 85 Z" fill="url(#flameGrad)" />
    <!-- Fins -->
    <path d="M30 65 L18 80 L35 80 Z" fill="#d50000" />
    <path d="M50 45 L65 32 L65 49 Z" fill="#d50000" />
    <!-- Body -->
    <ellipse cx="50" cy="50" rx="36" ry="18" fill="url(#rockBody)" stroke="#b0bec5" stroke-width="1.5" />
    <!-- Red Nose Cone -->
    <path d="M72 39 C82 44, 88 50, 88 50 C88 50, 82 56, 72 61 Z" fill="#d50000" />
    <!-- Window Porthole -->
    <circle cx="56" cy="50" r="7" fill="#00e5ff" stroke="#37474f" stroke-width="2" />
    <circle cx="54" cy="48" r="2" fill="#ffffff" />
  </g>
</svg>
